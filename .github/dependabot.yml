version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
      github-actions-routine:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
