name: GTFS Beta Prerelease

# Any push to the `staging` pointer (promote.yml) builds fresh SQLite artifacts and publishes
# them as {agency}-prerelease pre-releases (channel beta). Production tags ({agency},
# {agency}-previous, {agency}-YYYYMMDD-HHMM) are never touched by beta runs.
#
# This lives in a separate trigger file because a single `on.push` cannot
# combine branch-specific path filters: production only reacts to
# config/agencies.json changes, while staging must react to every push.

on:
  push:
    branches:
      - staging

# No concurrency block here on purpose: the called workflow's own
# workflow-level concurrency (gtfs-sync-release-${{ inputs.channel }}) also
# applies to workflow_call runs. Declaring the same group in both files makes
# the caller hold the group while the called workflow waits for it — GitHub
# detects that as a deadlock and cancels the run.

jobs:
  beta:
    uses: ./.github/workflows/gtfs-sync-release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      channel: beta

  motis:
    needs: beta
    uses: ./.github/workflows/motis-data.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      channel: beta
