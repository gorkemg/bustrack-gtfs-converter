name: GTFS Sync & Release

on:
  push:
    branches:
      - main
    paths:
      - config/agencies.json
  schedule:
    - cron: '15 4 * * 0,3,5'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no new GTFS data is detected'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: gtfs-sync-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: python -m unittest discover -s tests -v

  prepare-agencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      agencies: ${{ steps.agencies.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build Agency Matrix
        id: agencies
        run: |
          matrix=$(python3 -c 'import json, pathlib, re; payload = json.loads(pathlib.Path("config/agencies.json").read_text(encoding="utf-8")); agencies = [entry["id"] for entry in payload]; assert all(isinstance(a, str) and re.fullmatch(r"[a-z0-9][a-z0-9-]*", a) for a in agencies) and len(set(agencies)) == len(agencies); print(json.dumps(agencies))')
          if [ "$matrix" = "[]" ]; then
            echo "No agencies found in config/agencies.json" >&2
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sync:
    if: github.ref == 'refs/heads/main'
    needs:
      - tests
      - prepare-agencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        agency: ${{ fromJson(needs.prepare-agencies.outputs.agencies) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Prepare External Cache Period
        if: matrix.agency == 'pvta'
        run: |
          echo "EXTERNAL_CACHE_PERIOD=$(date -u +'%Y-%m')" >> "$GITHUB_ENV"

      - name: Restore External Resource Cache
        if: matrix.agency == 'pvta'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: internal/assets/cache/pvta_routedetails.xml
          key: external-resource-cache-${{ matrix.agency }}-${{ env.EXTERNAL_CACHE_PERIOD }}
          restore-keys: |
            external-resource-cache-${{ matrix.agency }}-

      - name: Prepare Timestamp
        id: timestamp
        run: |
          echo "TIMESTAMP=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_ENV"
          echo "value=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Run Converter
        id: converter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENCY: ${{ matrix.agency }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          set -o pipefail
          mkdir -p logs
          rm -f "data/${AGENCY}.sqlite.zip" "data/${AGENCY}.release-notes.md" converter-status
          args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_UPDATE" = "true" ]; then
            args+=(--force-update)
          fi
          python scripts/convert.py --agency "$AGENCY" --cleanup-extracted --status-file converter-status "${args[@]}" 2>&1 | tee "logs/${AGENCY}.log"

      - name: Validate Generated Release
        id: check_file
        env:
          AGENCY: ${{ matrix.agency }}
        run: |
          case "$(cat converter-status)" in
            unchanged) echo "created=false" >> "$GITHUB_OUTPUT" ;;
            generated)
              python scripts/validate_release.py "$AGENCY" "data/${AGENCY}.sqlite.zip"
              test -s "data/${AGENCY}.release-notes.md"
              echo "created=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Missing or invalid converter result" >&2; exit 1 ;;
          esac

      - name: Upload Converter Log
        if: always() && (steps.converter.outcome == 'failure' || steps.check_file.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: converter-log-${{ matrix.agency }}
          path: logs/${{ matrix.agency }}.log
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9

      - name: Capture Current Production Asset
        id: previous_asset
        if: steps.check_file.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous-release
          if gh release view "${{ matrix.agency }}" --repo "${{ github.repository }}" --json assets > current_release.json 2>/dev/null; then
            asset_name=$(python -c 'import json, pathlib; payload = json.loads(pathlib.Path("current_release.json").read_text(encoding="utf-8")); print(next((str(asset.get("name", "")) for asset in payload.get("assets", []) if str(asset.get("name", "")).endswith(".sqlite.zip")), ""))')
            if [ -n "$asset_name" ]; then
              gh release download "${{ matrix.agency }}" --repo "${{ github.repository }}" --pattern "$asset_name" --dir previous-release --clobber
              mv "previous-release/$asset_name" "previous-release/${{ matrix.agency }}-previous.sqlite.zip"
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "asset_path=previous-release/${{ matrix.agency }}-previous.sqlite.zip" >> "$GITHUB_OUTPUT"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Archive Release
        if: steps.check_file.outputs.created == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ matrix.agency }}-${{ steps.timestamp.outputs.value }}
          name: ${{ matrix.agency }} Archive ${{ steps.timestamp.outputs.value }}
          files: data/${{ matrix.agency }}.sqlite.zip
          body_path: data/${{ matrix.agency }}.release-notes.md
          draft: false
          prerelease: false
          make_latest: false
          append_body: false
          generate_release_notes: false

      - name: Create or Update Previous Release
        if: steps.previous_asset.outputs.available == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ matrix.agency }}-previous
          name: ${{ matrix.agency }} Previous ${{ steps.timestamp.outputs.value }}
          files: ${{ steps.previous_asset.outputs.asset_path }}
          body: |
            Rollback release captured from the prior production asset for ${{ matrix.agency }}.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: false
          append_body: false
          generate_release_notes: false

      - name: Create or Update Production Release
        if: steps.check_file.outputs.created == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ matrix.agency }}
          name: ${{ matrix.agency }} Production ${{ steps.timestamp.outputs.value }}
          files: data/${{ matrix.agency }}.sqlite.zip
          body_path: data/${{ matrix.agency }}.release-notes.md
          draft: false
          prerelease: false
          make_latest: false
          append_body: false
          generate_release_notes: false

      - name: Report Agency Result
        if: always()
        env:
          AGENCY: ${{ matrix.agency }}
          VALIDATION: ${{ steps.check_file.outcome }}
          CREATED: ${{ steps.check_file.outputs.created }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ] || [ "$VALIDATION" != "success" ]; then
            echo "Agency ${AGENCY} failed. Check the workflow and converter log." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CREATED" = "true" ]; then
            echo "Agency ${AGENCY} produced and published a validated release artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Agency ${AGENCY} is unchanged; no release was created." >> "$GITHUB_STEP_SUMMARY"
          fi
